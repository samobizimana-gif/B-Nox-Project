name: bnox
description: B-NOX — BEyond Network Ownership & eXchange
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.5
  cryptography: ^2.7.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  flutter_webrtc: ^1.5.2
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  mobile_scanner: ^5.2.3
  device_info_plus: ^10.1.0
  bip39_mnemonic: ^4.1.0
  emoji_picker_flutter: ^4.5.4
  file_picker: ^10.3.2
  flutter_local_notifications: ^17.2.4



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/background.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#050816"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 23